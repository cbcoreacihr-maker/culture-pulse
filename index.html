<title>Culture Pulse</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');

  :root{
    --bg:#F1EFE8; --surface:#FFFFFF; --surface-2:#E9E5DA;
    --ink:#1B2119; --ink-2:#565F58; --muted:#8B9088; --line:#DBD6C9;
    --accent:#2F6F5C; --accent-strong:#1E4A3D; --accent-soft:#DEEBE5; --accent-ink:#FFFFFF;
    --accent-2:#B65C2C; --accent-2-soft:#F2E0CE; --accent-2-strong:#8C4520;
    --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
    --shadow: 0 1px 2px rgba(27,33,25,0.06), 0 8px 24px -12px rgba(27,33,25,0.18);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#11150E; --surface:#191E17; --surface-2:#212820;
      --ink:#ECEAE1; --ink-2:#B7BDB1; --muted:#7C8378; --line:#2B322A;
      --accent:#63BFA0; --accent-strong:#8FDCC0; --accent-soft:#1E332C; --accent-ink:#0C1310;
      --accent-2:#E0985A; --accent-2-soft:#3A2A1B; --accent-2-strong:#F2B27F;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#11150E; --surface:#191E17; --surface-2:#212820;
    --ink:#ECEAE1; --ink-2:#B7BDB1; --muted:#7C8378; --line:#2B322A;
    --accent:#63BFA0; --accent-strong:#8FDCC0; --accent-soft:#1E332C; --accent-ink:#0C1310;
    --accent-2:#E0985A; --accent-2-soft:#3A2A1B; --accent-2-strong:#F2B27F;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
    color-scheme: dark;
  }

  *{box-sizing:border-box;}
  body{ background:var(--bg); color:var(--ink); font-family:"Public Sans", system-ui, -apple-system, sans-serif; }
  h1,h2,h3,.display{ font-family:"Fraunces", Georgia, serif; text-wrap:balance; letter-spacing:-0.01em; }
  .mono{ font-family:"IBM Plex Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  a{ color: var(--accent); }
  button{ font-family:inherit; }
  ::selection{ background: var(--accent-soft); }
  :focus-visible{ outline: 2px solid var(--accent); outline-offset: 2px; }

  .app{ min-height:100dvh; display:flex; }

  /* ---- Side nav ---- */
  .sidenav{
    width:236px; flex:0 0 auto; background:var(--surface); border-right:1px solid var(--line);
    padding:28px 20px; display:flex; flex-direction:column; gap:28px; position:sticky; top:0; height:100dvh;
  }
  .brand{ display:flex; flex-direction:column; gap:4px; }
  .brand .mark{ width:34px; height:34px; border-radius:9px; background:var(--accent); color:var(--accent-ink);
    display:flex; align-items:center; justify-content:center; font-family:"Fraunces",serif; font-weight:700; font-size:16px; margin-bottom:8px;}
  .brand .name{ font-size:17px; font-weight:600; font-family:"Fraunces", serif; }
  .brand .sub{ font-size:12px; color:var(--muted); }
  .navtabs{ display:flex; flex-direction:column; gap:4px; }
  .navtab{
    display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:9px; border:none; background:transparent;
    color:var(--ink-2); font-size:14px; font-weight:600; cursor:pointer; text-align:left; width:100%;
  }
  .navtab:hover{ background:var(--surface-2); color:var(--ink); }
  .navtab.active{ background:var(--accent-soft); color:var(--accent-strong); }
  .navtab .ico{ width:18px; text-align:center; }
  .navfoot{ margin-top:auto; font-size:11.5px; color:var(--muted); line-height:1.5; }

  @media (max-width: 760px){
    .app{ flex-direction:column; }
    .sidenav{ position:static; width:100%; height:auto; flex-direction:row; align-items:center; padding:14px 16px; gap:16px; }
    .brand .sub{ display:none; }
    .navtabs{ flex-direction:row; margin-left:auto; }
    .navfoot{ display:none; }
  }

  main{ flex:1 1 auto; min-width:0; }
  .view{ padding: 44px 32px 130px; max-width: 960px; margin: 0 auto; font-size:15px; }
  @media (max-width:760px){ .view{ padding: 26px 18px 130px; } }

  /* ---- Survey form ---- */
  .intro{ margin-bottom:30px; }
  .eyebrow{ font-size:12.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--accent); font-weight:700; margin-bottom:12px; }
  .intro h1{ font-size:33px; line-height:1.2; margin:0 0 14px; }
  .intro-list{ color:var(--ink-2); font-size:15.5px; line-height:1.7; max-width:66ch; margin:0 0 12px; padding-left:22px; }
  .intro-list li{ margin-bottom:4px; }
  .intro p{ color:var(--ink-2); font-size:15.5px; line-height:1.7; max-width:66ch; margin:0 0 8px;}
  .confid{ display:inline-flex; gap:8px; align-items:flex-start; background:var(--accent-soft); color:var(--accent-strong);
    border-radius:10px; padding:11px 15px; font-size:14px; line-height:1.55; margin-top:8px;}

  .closed-banner{ background:var(--accent-2-soft); color:var(--accent-2-strong); border-radius:12px; padding:20px 22px; font-size:14.5px; line-height:1.6; }

  .card{ background:var(--surface); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); }
  .section{ padding:26px; margin-bottom:22px; }
  .section-head{ margin-bottom:20px; }
  .section-tag{ font-size:11.5px; letter-spacing:.07em; text-transform:uppercase; font-weight:700; color:var(--muted); margin-bottom:7px; }
  .section h2{ font-size:20.5px; margin:0 0 7px; }
  .section .sub{ color:var(--ink-2); font-size:14.5px; line-height:1.5; }

  .field-row{ display:grid; grid-template-columns: 1fr 1fr; gap:16px; }
  @media (max-width:560px){ .field-row{ grid-template-columns:1fr; } }
  .field label{ display:block; font-size:13.5px; font-weight:600; margin-bottom:7px; color:var(--ink-2); }
  .field input[type=text], .field select, .field textarea{
    width:100%; border:1px solid var(--line); background:var(--bg); color:var(--ink); border-radius:9px;
    padding:11px 12px; font-size:14.5px; font-family:inherit;
  }
  .field select{ cursor:pointer; }
  .field textarea{ resize:vertical; min-height:80px; line-height:1.55; }
  .field input:focus, .field select:focus, .field textarea:focus{ background:var(--surface); }
  .optional-tag{ font-weight:400; color:var(--muted); text-transform:none; letter-spacing:0; }

  .scale-legend{ display:grid; grid-template-columns: 1fr repeat(5, 54px); gap:8px; padding:0 4px 10px; font-size:10.5px; color:var(--muted); }
  .scale-legend span{ text-align:center; line-height:1.25; min-width:0; overflow-wrap:break-word; hyphens:auto; }
  .scale-legend span:first-child{ text-align:left; }
  @media (max-width:620px){ .scale-legend{ display:none; } }

  .likert{ display:flex; flex-direction:column; }
  .likert-row{ display:grid; grid-template-columns: 1fr repeat(5, 54px); align-items:center; gap:8px;
    padding:12px 4px; border-top:1px solid var(--line); }
  .likert-row:first-child{ border-top:none; }
  @media (max-width:620px){
    .likert-row{ grid-template-columns: 1fr; gap:10px; padding:14px 4px; }
  }
  .likert-row .qnum{ color:var(--muted); font-size:12.5px; margin-right:6px; }
  .likert-row .qtext{ font-size:14.5px; line-height:1.5; }
  .likert-row.missing{ background: color-mix(in srgb, var(--critical) 8%, transparent); border-radius:8px; }
  .radio-group{ display:contents; }
  @media (max-width:620px){ .radio-group{ display:flex; gap:8px; flex-wrap:wrap; } }
  .radio-opt{ display:flex; align-items:center; justify-content:center; }
  .radio-opt input{ position:absolute; opacity:0; width:34px; height:34px; margin:0; cursor:pointer; }
  .radio-opt .dot{
    width:30px; height:30px; border-radius:50%; border:1.5px solid var(--line); display:flex; align-items:center; justify-content:center;
    font-size:12px; color:var(--muted); font-weight:600; background:var(--bg); pointer-events:none;
  }
  .radio-opt{ position:relative; }
  .radio-opt input:checked + .dot{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  .radio-opt input:focus-visible + .dot{ outline:2px solid var(--accent); outline-offset:2px; }
  @media (max-width:620px){ .radio-opt .dot{ width:38px; height:38px; } .radio-opt input{ width:38px; height:38px;} }

  .barrier-hint{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:14px; }
  .barrier-count{ font-size:12.5px; font-weight:700; color:var(--accent-2); }
  .barrier-count.full{ color:var(--critical); }
  .barrier-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px 16px; }
  @media (max-width:620px){ .barrier-grid{ grid-template-columns:1fr; } }
  .barrier-opt{ display:flex; align-items:flex-start; gap:10px; padding:9px 10px; border-radius:9px; border:1px solid transparent; cursor:pointer; }
  .barrier-opt:hover{ background:var(--surface-2); }
  .barrier-opt input{ margin-top:3px; accent-color:var(--accent-2); width:16px; height:16px; flex:0 0 auto; }
  .barrier-opt span{ font-size:13.5px; line-height:1.4; }
  .barrier-opt.disabled{ opacity:.4; cursor:not-allowed; }
  .other-row{ grid-column:1 / -1; }
  .other-row input[type=text]{ margin-top:8px; }

  .open-q{ margin-bottom:24px; }
  .open-q:last-child{ margin-bottom:0; }
  .open-q label{ display:block; font-size:14.5px; font-weight:600; margin-bottom:9px; }
  .open-q .qmeta{ font-size:12px; color:var(--muted); font-weight:400; margin-left:6px; }

  .required-star{ color:var(--accent-2); }

  .submit-bar{
    position:sticky; bottom:0; margin-top:8px; background:var(--surface); border:1px solid var(--line); border-radius:14px;
    box-shadow:var(--shadow); padding:16px 20px; display:flex; align-items:center; gap:16px;
  }
  .progress-wrap{ flex:1 1 auto; }
  .progress-label{ display:flex; justify-content:space-between; font-size:12px; color:var(--ink-2); margin-bottom:6px; }
  .progress-track{ height:6px; border-radius:99px; background:var(--surface-2); overflow:hidden; }
  .progress-fill{ height:100%; background:var(--accent); border-radius:99px; transition:width .25s ease; }
  .btn{ appearance:none; border:none; border-radius:10px; padding:12px 22px; font-weight:700; font-size:14px; cursor:pointer; white-space:nowrap; }
  .btn-primary{ background:var(--accent); color:var(--accent-ink); }
  .btn-primary:disabled{ opacity:.5; cursor:not-allowed; }
  .btn-ghost{ background:transparent; color:var(--accent); border:1px solid var(--line); }
  .form-error{ background: color-mix(in srgb, var(--critical) 12%, var(--surface)); color:var(--critical); border-radius:10px; padding:12px 14px; font-size:13.5px; margin-bottom:16px; }

  .thankyou{ text-align:center; padding:70px 20px; }
  .thankyou .mark{ width:56px; height:56px; border-radius:16px; background:var(--accent-soft); color:var(--accent-strong);
    display:flex; align-items:center; justify-content:center; margin:0 auto 20px; font-size:26px; }
  .thankyou h1{ font-size:26px; margin:0 0 10px; }
  .thankyou p{ color:var(--ink-2); font-size:14.5px; max-width:44ch; margin:0 auto 18px; line-height:1.6;}

  /* ---- Results dashboard ---- */
  .results-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:20px; flex-wrap:wrap; margin-bottom:22px; }
  .results-head h1{ font-size:26px; margin:0 0 6px; }
  .results-head p{ color:var(--ink-2); font-size:13.5px; margin:0; max-width:52ch; }
  .status-toggle{ display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--line);
    border-radius:99px; padding:8px 8px 8px 16px; box-shadow:var(--shadow); }
  .status-toggle .lbl{ font-size:12.5px; font-weight:700; }
  .switch{ position:relative; width:40px; height:22px; border-radius:99px; background:var(--surface-2); border:1px solid var(--line); cursor:pointer; }
  .switch .knob{ position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; background:var(--muted); transition:.18s; }
  .switch.on{ background:var(--accent-soft); border-color:var(--accent); }
  .switch.on .knob{ left:20px; background:var(--accent); }

  .filters{ display:flex; gap:12px; flex-wrap:wrap; margin-bottom:22px; }
  .filters select{ border:1px solid var(--line); background:var(--surface); color:var(--ink); border-radius:9px; padding:9px 12px; font-size:13px; font-family:inherit; }
  .filters .export-btn{ margin-left:auto; }

  .stat-tiles{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:24px; }
  @media (max-width:760px){ .stat-tiles{ grid-template-columns:repeat(2,1fr); } }
  .tile{ background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:18px; box-shadow:var(--shadow); }
  .tile .tlabel{ font-size:11.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); font-weight:700; margin-bottom:10px; }
  .tile .tvalue{ font-family:"Fraunces",serif; font-size:28px; font-weight:600; }
  .tile .tvalue .unit{ font-size:14px; font-family:"Public Sans",sans-serif; color:var(--ink-2); font-weight:600; margin-left:2px; }
  .tile .tnote{ font-size:12px; color:var(--muted); margin-top:6px; }

  .panel-grid{ display:grid; grid-template-columns: 1.15fr 0.85fr; gap:18px; align-items:start; }
  @media (max-width:900px){ .panel-grid{ grid-template-columns:1fr; } }
  .panel{ background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:20px 22px; box-shadow:var(--shadow); margin-bottom:18px; }
  .panel h3{ font-size:15.5px; margin:0 0 4px; }
  .panel .phint{ font-size:12px; color:var(--muted); margin-bottom:16px; }

  .bar-row{ display:grid; grid-template-columns: 1fr 78px; gap:12px; align-items:center; padding:7px 0; }
  .bar-row .blabel{ font-size:12.5px; line-height:1.35; color:var(--ink); }
  .bar-track{ height:9px; border-radius:5px; background:var(--surface-2); overflow:hidden; margin-top:5px; }
  .bar-fill{ height:100%; border-radius:5px; }
  .bar-val{ font-size:12px; text-align:right; color:var(--ink-2); }
  .legend{ display:flex; gap:14px; flex-wrap:wrap; font-size:11px; color:var(--muted); margin-top:10px; }
  .legend .sw{ display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:5px; }

  .barrier-row{ display:grid; grid-template-columns: 1fr 48px; gap:12px; align-items:center; padding:6px 0; }
  .barrier-row .blabel{ font-size:12.5px; }

  .empty-note{ font-size:13px; color:var(--muted); padding:18px 4px; line-height:1.6; }

  .qual-tabs{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px; }
  .qual-tab{ border:1px solid var(--line); background:var(--bg); color:var(--ink-2); font-size:12px; font-weight:600; padding:6px 12px; border-radius:99px; cursor:pointer; }
  .qual-tab.active{ background:var(--accent-2-soft); color:var(--accent-2-strong); border-color:transparent; }
  .qual-list{ max-height:320px; overflow-y:auto; display:flex; flex-direction:column; gap:10px; padding-right:4px; }
  .qual-item{ background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:10px 12px; }
  .qual-item .qmeta{ font-size:10.5px; color:var(--muted); margin-bottom:4px; text-transform:uppercase; letter-spacing:.04em; }
  .qual-item p{ margin:0; font-size:13px; line-height:1.5; }

  .sr-only{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; }

  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; animation:none !important; } }
</style>

<div class="app">
  <nav class="sidenav">
    <div class="brand">
      <div class="mark">CP</div>
      <div class="name">Culture Pulse</div>
      <div class="sub">High-Performance Culture &amp; Barriers Survey</div>
    </div>
    <div class="navtabs">
      <button class="navtab active" data-tab="survey" id="tab-btn-survey">
        <span class="ico">📝</span> Take the survey
      </button>
      <button class="navtab" data-tab="results" id="tab-btn-results">
        <span class="ico">📊</span> Results (HR)
      </button>
    </div>
    <div class="navfoot">
      Responses are aggregated only.<br>Individual answers stay confidential.
    </div>
  </nav>

  <main>
    <!-- ===================== SURVEY VIEW ===================== -->
    <section class="view" id="view-survey">
      <div id="survey-mount"></div>
    </section>

    <!-- ===================== RESULTS VIEW ===================== -->
    <section class="view" id="view-results" hidden>
      <div id="results-mount"></div>
    </section>
  </main>
</div>

<script>
(function(){

  // ---------------------------------------------------------------
  // Data model
  // ---------------------------------------------------------------
  var STATEMENTS = [
    "I understand how my work contributes to our business goals.",
    "Our organizational values are reflected in day-to-day leadership decisions and behavior.",
    "My performance goals/KPIs are clear, measurable, and aligned with business priorities.",
    "My performance is reviewed regularly, not only at year-end.",
    "High performance is recognized and rewarded appropriately.",
    "Underperformance is addressed promptly and fairly.",
    "My manager gives me useful coaching and feedback to improve performance.",
    "I have enough authority to make decisions within my role.",
    "My manager actively removes barriers that affect my performance.",
    "Decisions are made quickly enough to support business needs.",
    "Approval processes enable fast execution rather than create unnecessary delays.",
    "Our organization adapts quickly when priorities or market conditions change.",
    "I have opportunities to build the skills needed to perform better.",
    "My manager actively supports my learning and professional growth.",
    "Employees are encouraged to suggest better ways of working.",
    "Good ideas are acted upon within a reasonable timeframe.",
    "Customer needs influence our business decisions and priorities.",
    "Teams and functions collaborate effectively to achieve common goals.",
    "I can raise concerns or different opinions without fear of negative consequences.",
    "Employees are treated fairly and with respect, regardless of role or relationship.",
    "People have fair access to opportunities to contribute, learn, and grow.",
    "My workload allows me to maintain high-quality performance consistently.",
    "I receive the support and resources needed to sustain my performance.",
    "Leaders demonstrate the ethical behavior and integrity they expect from others.",
    "I have the tools, technology, and timely information needed to perform efficiently."
  ];

  var BARRIERS = [
    "Unclear goals or priorities", "Too many approval levels",
    "Slow decision-making", "Lack of authority / empowerment",
    "Insufficient manager coaching", "Lack of timely feedback",
    "Poor cross-functional collaboration", "Insufficient manpower / resources",
    "Inadequate tools / technology", "Lack of timely data / information",
    "Too many manual or repetitive processes", "Excessive workload",
    "Too many meetings / administrative activities", "Lack of skills / training",
    "Weak recognition of good performance", "Underperformance not addressed",
    "Fear of making mistakes", "Fear of speaking up",
    "Workplace politics / favoritism", "Frequent changes in priorities"
  ];
  var OTHER_LABEL = "Other";
  var BUSINESS_FUNCTIONS = ["ACI Semiconductor","Advanced AI Lab","Consumer Digital Business","Strategy, Planning & Insights department","Adommo Medhabi Program"];
  var JOB_GRADES = ["OM 01","OM 02","OM 03","OM 04","OM 05","OM 06","OM 07","OM 08","OM 09","OM 10"];

  var OPEN_QUESTIONS = [
    { key:"biggestObstacle", label:"What is the single biggest obstacle preventing you from doing your best work?", required:false },
    { key:"managerAction", label:"What one thing should your immediate manager do differently to help you perform better?", required:false },
    { key:"processToSimplify", label:"What process, policy, approval, or activity should be simplified or removed to improve productivity?", required:false },
    { key:"toolsNeeded", label:"What tools/technologies would significantly improve your performance?", required:false }
  ];

  var SCALE = ["Strongly Disagree","Disagree","Neutral","Agree","Strongly Agree"];
  var MAX_BARRIERS = 3;
  var STORAGE_KEY = "culturePulse.submittedId.v1";

  // ---------------------------------------------------------------
  // Backend: Google Apps Script Web App (see SETUP instructions)
  // ---------------------------------------------------------------
  // 1. Deploy the companion Apps Script as a Web App ("Execute as: Me",
  //    "Who has access: Anyone"), then paste its /exec URL below.
  var API_URL = "https://script.google.com/macros/s/AKfycbw97wHcW1Rrw01hkTT3mpBqjN0Akn8NDNv9cOTVrAoDQp8-oFdRU0m3I1HTlChARNlT/exec";

  var meta = { open: true, loaded: false };
  var HR_CODE_KEY = "culturePulse.hrCode.v1";
  var HEADCOUNT_KEY = "culturePulse.headcount.v1";
  var responses = []; // loaded only after the HR gate is passed
  var responsesLoaded = false;
  var resultsUnlocked = false;
  var resultsLoading = false;
  var passcodeDraft = "";
  var passcodeError = false;
  var storedHrCode = null;
  var activeTab = "survey";
  var activeQualTab = OPEN_QUESTIONS[0].key;

  var form = {
    businessFunction: "",
    gradeLevel: "",
    ratings: {},        // { "1": 4, ... }
    barriers: [],        // labels, max 3
    otherBarrierText: "",
    biggestObstacle: "",
    managerAction: "",
    processToSimplify: "",
    toolsNeeded: ""
  };
  var submitted = false;
  var submitting = false;
  var showErrors = false;

  var filters = { fn: "ALL", grade: "ALL" };

  // ---------------------------------------------------------------
  // Helpers
  // ---------------------------------------------------------------
  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function el(id){ return document.getElementById(id); }
  function q(sel, root){ return (root||document).querySelector(sel); }
  function qa(sel, root){ return Array.prototype.slice.call((root||document).querySelectorAll(sel)); }

  function scoreColor(mean){
    if (mean >= 4.0) return "var(--good)";
    if (mean >= 3.5) return "#c98f00"; /* warning tuned for surface contrast */
    if (mean >= 3.0) return "var(--serious)";
    return "var(--critical)";
  }
  function scoreBand(mean){
    if (mean >= 4.0) return "Strong";
    if (mean >= 3.5) return "Fair";
    if (mean >= 3.0) return "At risk";
    return "Critical";
  }

  // ---------------------------------------------------------------
  // Rendering: SURVEY
  // ---------------------------------------------------------------
  function ratingsCompleteCount(){
    var n = 0;
    for (var i=1;i<=STATEMENTS.length;i++){ if (form.ratings[i]) n++; }
    return n;
  }
  function computeProgress(){
    var totalUnits = STATEMENTS.length + 1 + 1; // 25 ratings + barriers + Q27
    var done = ratingsCompleteCount();
    if (form.barriers.length > 0) done++;
    if (form.biggestObstacle.trim()) done++;
    return Math.round((done/totalUnits)*100);
  }

  function renderSurvey(){
    var mount = el("survey-mount");
    if (submitted){
      mount.innerHTML =
        '<div class="thankyou">' +
          '<div class="mark">✓</div>' +
          '<h1>Thank you — response recorded</h1>' +
          '<p>Your answers have been added to the aggregate results. Individual responses are not shared or attributed.</p>' +
          '<button class="btn btn-ghost" id="btn-again">Submit another response</button>' +
        '</div>';
      el("btn-again").addEventListener("click", function(){
        try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
        submitted = false;
        form = { businessFunction:"", gradeLevel:"", ratings:{}, barriers:[], otherBarrierText:"",
          biggestObstacle:"", managerAction:"", processToSimplify:"", toolsNeeded:"" };
        showErrors = false;
        renderSurvey();
        window.scrollTo({top:0, behavior:"smooth"});
      });
      return;
    }

    if (meta.loaded && meta.open === false){
      mount.innerHTML =
        '<div class="intro">' +
          '<div class="eyebrow">Culture Pulse</div>' +
          '<h1 class="display">High-Performance Culture Baseline &amp; Performance Barriers Survey</h1>' +
        '</div>' +
        '<div class="closed-banner"><strong>This survey is currently closed.</strong><br>The HR team has paused new responses. Please check back later or contact HR if you believe this is a mistake.</div>';
      return;
    }

    var errorBanner = "";
    if (showErrors){
      var missing = [];
      if (!form.businessFunction) missing.push("Business / Function");
      if (!form.gradeLevel) missing.push("Job Grade");
      if (ratingsCompleteCount() < STATEMENTS.length) missing.push((STATEMENTS.length - ratingsCompleteCount()) + " statement(s) in Section A");
      if (form.barriers.length === 0) missing.push("at least 1 barrier in Question 26");
      if (form.barriers.indexOf(OTHER_LABEL) !== -1 && !form.otherBarrierText.trim()) missing.push("a description for “Other”");
      if (missing.length){
        errorBanner = '<div class="form-error">Please complete: ' + esc(missing.join(", ")) + '.</div>';
      }
    }

    var html = '';
    html += '<div class="intro">' +
      '<div class="eyebrow">Employee Survey</div>' +
      '<h1 class="display">High-Performance Culture Baseline &amp; Performance Barriers Survey</h1>' +
      '<ul class="intro-list">' +
        '<li>This survey has two objectives: assess the current condition of our high-performance culture, and identify what is preventing employees from doing their best work.</li>' +
        '<li>Please answer based on your actual experience.</li>' +
        '<li>Results are analyzed in aggregate to set improvement priorities.</li>' +
      '</ul>' +
      '<div class="confid">🔒 Individual responses remain strictly confidential. Only aggregated results are reviewed by HR.</div>' +
    '</div>';

    html += errorBanner;

    // Respondent profile
    html += '<div class="card section">' +
      '<div class="section-head"><div class="section-tag">Respondent profile</div>' +
      '<h2>About you</h2><div class="sub">Used only to group results — never to identify you.</div></div>' +
      '<div class="field-row">' +
        '<div class="field"><label for="f-bf">Business / Function <span class="required-star">*</span></label><select id="f-bf" data-required="1">' +
          '<option value="" disabled'+(form.businessFunction?'':' selected')+'>Select…</option>' +
          BUSINESS_FUNCTIONS.map(function(o){ return '<option value="'+esc(o)+'"'+(form.businessFunction===o?' selected':'')+'>'+esc(o)+'</option>'; }).join('') +
        '</select></div>' +
        '<div class="field"><label for="f-grade">Job Grade <span class="required-star">*</span></label><select id="f-grade" data-required="1">' +
          '<option value="" disabled'+(form.gradeLevel?'':' selected')+'>Select…</option>' +
          JOB_GRADES.map(function(o){ return '<option value="'+esc(o)+'"'+(form.gradeLevel===o?' selected':'')+'>'+esc(o)+'</option>'; }).join('') +
        '</select></div>' +
      '</div>' +
    '</div>';

    // Section A
    html += '<div class="card section">' +
      '<div class="section-head"><div class="section-tag">Section A</div>' +
      '<h2>High-performance culture baseline</h2>' +
      '<div class="sub">Rate each statement based on your current experience in the organization.</div></div>' +
      '<div class="scale-legend"><span></span>' + SCALE.map(function(s,i){ return '<span>'+(i+1)+'<br>'+s+'</span>'; }).join('') + '</div>' +
      '<div class="likert">' +
      STATEMENTS.map(function(text, idx){
        var n = idx+1;
        var missingRow = showErrors && !form.ratings[n];
        var opts = '';
        for (var v=1; v<=5; v++){
          var checked = form.ratings[n] === v ? 'checked' : '';
          opts += '<label class="radio-opt"><input type="radio" name="q'+n+'" value="'+v+'" '+checked+' data-qn="'+n+'"><span class="dot">'+v+'</span><span class="sr-only">'+SCALE[v-1]+'</span></label>';
        }
        return '<div class="likert-row'+(missingRow?' missing':'')+'"><div class="qtext"><span class="qnum">'+n+'.</span> '+esc(text)+'</div><div class="radio-group">'+opts+'</div></div>';
      }).join('') +
      '</div>' +
    '</div>';

    // Section B
    var barrierFull = form.barriers.length >= MAX_BARRIERS;
    html += '<div class="card section">' +
      '<div class="section-head"><div class="section-tag">Section B</div>' +
      '<h2>What is stopping you from doing your best work?</h2>' +
      '<div class="sub">Identify the most important barriers and support requirements affecting your performance.</div></div>' +
      '<div class="open-q">' +
        '<label>26. Which THREE factors most limit your ability to perform at your best? <span class="required-star">*</span><span class="qmeta">select up to '+MAX_BARRIERS+'</span></label>' +
        '<div class="barrier-hint"><span></span><span class="barrier-count'+(barrierFull?' full':'')+'">'+form.barriers.length+' / '+MAX_BARRIERS+' selected</span></div>' +
        '<div class="barrier-grid">' +
        BARRIERS.map(function(b){
          var checked = form.barriers.indexOf(b) !== -1;
          var disabled = !checked && barrierFull;
          return '<label class="barrier-opt'+(disabled?' disabled':'')+'"><input type="checkbox" value="'+esc(b)+'" '+(checked?'checked':'')+(disabled?' disabled':'')+' data-barrier="1"><span>'+esc(b)+'</span></label>';
        }).join('') +
        (function(){
          var checked = form.barriers.indexOf(OTHER_LABEL) !== -1;
          var disabled = !checked && barrierFull;
          return '<label class="barrier-opt other-row'+(disabled?' disabled':'')+'" style="grid-column:1/-1"><input type="checkbox" value="'+OTHER_LABEL+'" '+(checked?'checked':'')+(disabled?' disabled':'')+' data-barrier="1"><span>Other</span>' +
            (checked ? '<input type="text" id="f-other-text" placeholder="Describe the other factor" value="'+esc(form.otherBarrierText)+'" style="margin-left:8px;flex:1;">' : '') +
          '</label>';
        })() +
        '</div>' +
      '</div>' +
      OPEN_QUESTIONS.map(function(oq, i){
        var n = 27 + i;
        return '<div class="open-q"><label>'+n+'. '+esc(oq.label)+'</label>' +
          '<textarea data-open="'+oq.key+'" placeholder="Type your answer…">'+esc(form[oq.key])+'</textarea></div>';
      }).join('') +
    '</div>';

    // Submit bar
    var pct = computeProgress();
    html += '<div class="submit-bar">' +
      '<div class="progress-wrap"><div class="progress-label"><span>Progress</span><span class="mono">'+pct+'%</span></div>' +
      '<div class="progress-track"><div class="progress-fill" style="width:'+pct+'%"></div></div></div>' +
      '<button class="btn btn-primary" id="btn-submit" '+(submitting?'disabled':'')+'>'+(submitting?'Submitting…':'Submit survey')+'</button>' +
    '</div>';

    mount.innerHTML = html;
    bindSurveyEvents(mount);
  }

  function bindSurveyEvents(mount){
    var bf = el("f-bf"); if (bf) bf.addEventListener("change", function(){ form.businessFunction = bf.value; renderSurvey(); });
    var gr = el("f-grade"); if (gr) gr.addEventListener("change", function(){ form.gradeLevel = gr.value; renderSurvey(); });

    qa('input[type=radio]', mount).forEach(function(r){
      r.addEventListener("change", function(){
        form.ratings[parseInt(r.getAttribute("data-qn"),10)] = parseInt(r.value,10);
        renderSurvey();
      });
    });

    qa('input[data-barrier]', mount).forEach(function(cb){
      cb.addEventListener("change", function(){
        var v = cb.value;
        var idx = form.barriers.indexOf(v);
        if (cb.checked){
          if (form.barriers.length < MAX_BARRIERS && idx === -1) form.barriers.push(v);
        } else {
          if (idx !== -1) form.barriers.splice(idx,1);
          if (v === OTHER_LABEL) form.otherBarrierText = "";
        }
        renderSurvey();
      });
    });

    var otherText = el("f-other-text");
    if (otherText) otherText.addEventListener("input", function(){ form.otherBarrierText = otherText.value; });

    qa('textarea[data-open]', mount).forEach(function(ta){
      ta.addEventListener("input", function(){ form[ta.getAttribute("data-open")] = ta.value; });
    });

    var submitBtn = el("btn-submit");
    if (submitBtn) submitBtn.addEventListener("click", handleSubmit);
  }

  function validate(){
    if (!form.businessFunction) return false;
    if (!form.gradeLevel) return false;
    if (ratingsCompleteCount() < STATEMENTS.length) return false;
    if (form.barriers.length === 0) return false;
    if (form.barriers.indexOf(OTHER_LABEL) !== -1 && !form.otherBarrierText.trim()) return false;
    return true;
  }

  function handleSubmit(){
    showErrors = true;
    if (!validate()){ renderSurvey(); var e = q(".form-error"); if (e) e.scrollIntoView({behavior:"smooth", block:"center"}); return; }
    if (!API_URL || API_URL.indexOf("PASTE_YOUR") === 0){
      alert("This page isn't connected to its Google Sheet yet — the site owner needs to finish setup.");
      return;
    }

    submitting = true; renderSurvey();

    var payload = {
      action: "submit",
      businessFunction: form.businessFunction.trim(),
      gradeLevel: form.gradeLevel.trim(),
      ratings: Object.assign({}, form.ratings),
      barriers: form.barriers.slice(),
      otherBarrierText: form.barriers.indexOf(OTHER_LABEL) !== -1 ? form.otherBarrierText.trim() : "",
      biggestObstacle: form.biggestObstacle.trim(),
      managerAction: form.managerAction.trim(),
      processToSimplify: form.processToSimplify.trim(),
      toolsNeeded: form.toolsNeeded.trim()
    };

    fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" }, // avoids a CORS preflight Apps Script can't answer
      body: JSON.stringify(payload)
    }).then(function(res){ return res.json(); }).then(function(json){
      if (!json || json.ok !== true){
        throw new Error(json && json.error || "unknown");
      }
      try{ localStorage.setItem(STORAGE_KEY, "1"); }catch(e){}
      submitting = false; submitted = true; showErrors = false;
      renderSurvey();
      window.scrollTo({top:0, behavior:"smooth"});
    }).catch(function(err){
      submitting = false;
      renderSurvey();
      var reason = (err && err.message === "closed") ? "The survey is currently closed." : "We couldn't submit your response. Please check your connection and try again.";
      alert(reason);
    });
  }

  // ---------------------------------------------------------------
  // Rendering: RESULTS
  // ---------------------------------------------------------------
  function distinctValues(field){
    var set = {};
    responses.forEach(function(r){ var v = (r[field]||"").trim(); if (v) set[v] = true; });
    return Object.keys(set).sort();
  }

  function filteredResponses(){
    return responses.filter(function(r){
      if (filters.fn !== "ALL" && (r.businessFunction||"").trim() !== filters.fn) return false;
      if (filters.grade !== "ALL" && (r.gradeLevel||"").trim() !== filters.grade) return false;
      return true;
    });
  }

  // Group rows by a field (e.g. businessFunction, gradeLevel) and compute
  // response count + average Section A culture score for each group.
  function groupStats(rows, field){
    var groups = {};
    rows.forEach(function(r){
      var key = (r[field]||"").trim() || "Unspecified";
      if (!groups[key]) groups[key] = { label:key, count:0, sum:0, n:0 };
      groups[key].count++;
      for (var i=1;i<=STATEMENTS.length;i++){
        var v = r.ratings && r.ratings[i];
        if (v){ groups[key].sum += v; groups[key].n++; }
      }
    });
    return Object.keys(groups).map(function(k){
      var g = groups[k];
      return { label:g.label, count:g.count, mean: g.n ? g.sum/g.n : 0 };
    }).sort(function(a,b){ return b.mean - a.mean; });
  }

  // Distribution of every individual Section A rating (1-5) across all rows.
  function ratingDistribution(rows){
    var counts = [0,0,0,0,0,0];
    rows.forEach(function(r){
      for (var i=1;i<=STATEMENTS.length;i++){
        var v = r.ratings && r.ratings[i];
        if (v) counts[v]++;
      }
    });
    var total = counts.reduce(function(a,b){return a+b;},0) || 1;
    return [1,2,3,4,5].map(function(v){ return { label: SCALE[v-1], count: counts[v], pct: counts[v]/total*100 }; });
  }

  // Response volume by submission date (YYYY-MM-DD), oldest first.
  function responsesByDate(rows){
    var groups = {};
    rows.forEach(function(r){
      var d = (r.submittedAt||"").slice(0,10) || "Unknown";
      groups[d] = (groups[d]||0) + 1;
    });
    return Object.keys(groups).sort().map(function(k){ return { label:k, count:groups[k] }; });
  }

  function renderGroupPanel(title, hint, stats){
    var html = '<div class="panel"><h3>'+esc(title)+'</h3><div class="phint">'+esc(hint)+'</div>';
    if (stats.length === 0){
      html += '<div class="empty-note" style="padding:6px 2px;">No data yet.</div>';
    }
    stats.forEach(function(s){
      var pct = (s.mean/5*100).toFixed(1);
      html += '<div class="bar-row"><div><div class="blabel">'+esc(s.label)+' <span class="mono" style="color:var(--muted);font-size:11px">('+s.count+' resp.)</span></div>' +
        '<div class="bar-track"><div class="bar-fill" style="width:'+pct+'%;background:'+scoreColor(s.mean)+'"></div></div></div>' +
        '<div class="bar-val mono">'+s.mean.toFixed(2)+'</div></div>';
    });
    html += '</div>';
    return html;
  }

  // Most frequently selected Section B barrier within each group value.
  function topBarrierByGroup(rows, field){
    var groups = {};
    rows.forEach(function(r){
      var key = (r[field]||"").trim() || "Unspecified";
      if (!groups[key]) groups[key] = { total:0, barriers:{} };
      groups[key].total++;
      (r.barriers||[]).forEach(function(b){
        groups[key].barriers[b] = (groups[key].barriers[b]||0) + 1;
      });
    });
    return Object.keys(groups).map(function(k){
      var g = groups[k];
      var top = null, topCount = 0;
      Object.keys(g.barriers).forEach(function(b){
        if (g.barriers[b] > topCount){ topCount = g.barriers[b]; top = b; }
      });
      return { label:k, total:g.total, topBarrier: top || "—", pct: g.total ? Math.round(topCount/g.total*100) : 0 };
    }).sort(function(a,b){ return b.total-a.total; });
  }

  function renderTopBarrierPanel(title, hint, stats){
    var html = '<div class="panel"><h3>'+esc(title)+'</h3><div class="phint">'+esc(hint)+'</div>';
    if (stats.length === 0){
      html += '<div class="empty-note" style="padding:6px 2px;">No data yet.</div>';
    }
    stats.forEach(function(s){
      html += '<div class="bar-row"><div><div class="blabel">'+esc(s.label)+' <span class="mono" style="color:var(--muted);font-size:11px">('+s.total+' resp.)</span><br>' +
        '<span style="color:var(--accent-2);font-weight:600">'+esc(s.topBarrier)+'</span></div>' +
        '<div class="bar-track"><div class="bar-fill" style="width:'+s.pct+'%;background:var(--accent-2)"></div></div></div>' +
        '<div class="bar-val mono">'+s.pct+'%</div></div>';
    });
    html += '</div>';
    return html;
  }

  // Lowest-scoring Section A statements within each group value (drill-down).
  function weakestByGroup(rows, field, topN){
    var groups = {};
    rows.forEach(function(r){
      var key = (r[field]||"").trim() || "Unspecified";
      if (!groups[key]) groups[key] = [];
      groups[key].push(r);
    });
    return Object.keys(groups).map(function(k){
      var grows = groups[k];
      var qMeans = STATEMENTS.map(function(text, idx){
        var n = idx+1, sum=0, count=0;
        grows.forEach(function(r){ var v = r.ratings && r.ratings[n]; if (v){ sum+=v; count++; } });
        return { n:n, text:text, mean: count ? sum/count : 0, count: count };
      }).filter(function(m){ return m.count>0; });
      qMeans.sort(function(a,b){ return a.mean-b.mean; });
      return { label:k, count: grows.length, weakest: qMeans.slice(0, topN) };
    }).sort(function(a,b){ return b.count-a.count; });
  }

  function renderWeakestPanel(title, hint, groups){
    var html = '<div class="panel"><h3>'+esc(title)+'</h3><div class="phint">'+esc(hint)+'</div>';
    if (groups.length === 0){
      html += '<div class="empty-note" style="padding:6px 2px;">No data yet.</div>';
    }
    groups.forEach(function(g){
      html += '<div style="margin-bottom:14px"><div class="blabel" style="font-weight:700;margin-bottom:6px">'+esc(g.label)+
        ' <span class="mono" style="color:var(--muted);font-weight:400;font-size:11px">('+g.count+' resp.)</span></div>';
      if (g.weakest.length === 0){
        html += '<div class="empty-note" style="padding:2px 2px;font-size:12px">No ratings yet.</div>';
      } else {
        g.weakest.forEach(function(m){
          var pct = (m.mean/5*100).toFixed(1);
          html += '<div class="bar-row"><div><div class="blabel" style="font-size:12px">'+m.n+'. '+esc(m.text)+'</div>' +
            '<div class="bar-track"><div class="bar-fill" style="width:'+pct+'%;background:'+scoreColor(m.mean)+'"></div></div></div>' +
            '<div class="bar-val mono">'+m.mean.toFixed(2)+'</div></div>';
        });
      }
      html += '</div>';
    });
    html += '</div>';
    return html;
  }

  // Simple English keyword-frequency summary across all open-ended answers.
  var KEYWORD_STOPWORDS = {"the":1,"and":1,"that":1,"this":1,"with":1,"from":1,"have":1,"more":1,"some":1,"also":1,"into":1,"just":1,"than":1,"them":1,"they":1,"their":1,"there":1,"would":1,"could":1,"should":1,"which":1,"when":1,"what":1,"where":1,"been":1,"being":1,"were":1,"those":1,"these":1,"about":1,"over":1,"only":1,"much":1,"many":1,"very":1,"because":1,"dont":1,"cant":1,"for":1,"are":1,"was":1,"our":1,"its":1,"but":1,"you":1,"your":1,"all":1,"any":1,"get":1,"got":1,"due":1,"able":1,"make":1,"made":1,"still":1,"like":1,"most":1,"even":1,"such":1,"other":1,"each":1,"here":1,"often":1,"day":1,"days":1,"time":1,"currently":1,"work":1,"works":1,"working":1};
  function keywordSummary(rows){
    var texts = [];
    rows.forEach(function(r){
      [r.biggestObstacle, r.managerAction, r.processToSimplify, r.toolsNeeded].forEach(function(t){
        if (t) texts.push(t);
      });
    });
    var counts = {};
    texts.forEach(function(t){
      var words = String(t).toLowerCase().replace(/[^a-z\s]/g,' ').split(/\s+/);
      words.forEach(function(w){
        if (w.length < 4) return;
        if (KEYWORD_STOPWORDS[w]) return;
        counts[w] = (counts[w]||0) + 1;
      });
    });
    return Object.keys(counts).map(function(w){ return { label:w, count:counts[w] }; })
      .sort(function(a,b){ return b.count-a.count; })
      .slice(0,15);
  }

  function getHeadcount(){
    try{ var v = localStorage.getItem(HEADCOUNT_KEY); return v ? Number(v) : null; }catch(e){ return null; }
  }
  function setHeadcount(v){
    try{ if (v){ localStorage.setItem(HEADCOUNT_KEY, String(v)); } else { localStorage.removeItem(HEADCOUNT_KEY); } }catch(e){}
  }

  function renderResults(){
    var mount = el("results-mount");

    var head = '<div class="results-head">' +
      '<div><h1 class="display">Results dashboard</h1><p>Aggregated view for HR &amp; management. Protected by an access code — share it only with people who should see raw survey results.</p></div>' +
    '</div>';

    if (!resultsUnlocked){
      var gateBody;
      if (resultsLoading){
        gateBody = '<div class="empty-note">Checking access code…</div>';
      } else {
        gateBody = '<div class="card section" style="max-width:380px">' +
          '<div class="section-head"><h2 style="font-size:17px">Enter HR access code</h2>' +
          '<div class="sub">Ask the survey owner for the code if you don\'t have it.</div></div>' +
          (passcodeError ? '<div class="form-error">That code doesn\'t match, or the sheet isn\'t reachable. Please try again.</div>' : '') +
          '<div class="field"><input type="password" id="f-passcode" placeholder="Access code" value="'+esc(passcodeDraft)+'"></div>' +
          '<button class="btn btn-primary" id="btn-unlock" style="margin-top:14px;width:100%">Unlock dashboard</button>' +
        '</div>';
      }
      mount.innerHTML = head + gateBody;
      var pw = el("f-passcode");
      if (pw){
        pw.addEventListener("input", function(){ passcodeDraft = pw.value; });
        pw.addEventListener("keydown", function(e){ if (e.key === "Enter") attemptUnlock(); });
      }
      var ub = el("btn-unlock");
      if (ub) ub.addEventListener("click", attemptUnlock);
      return;
    }

    var rows = filteredResponses();
    var total = rows.length;

    // per-question means
    var qMeans = STATEMENTS.map(function(text, idx){
      var n = idx+1, sum=0, count=0;
      rows.forEach(function(r){ var v = r.ratings && r.ratings[n]; if (v){ sum+=v; count++; } });
      return { n:n, text:text, mean: count? sum/count : 0, count: count };
    });
    var answered = qMeans.filter(function(m){ return m.count>0; });
    var overallAvg = answered.length ? (answered.reduce(function(a,m){return a+m.mean;},0)/answered.length) : 0;
    var sortedAsc = answered.slice().sort(function(a,b){ return a.mean-b.mean; });

    // barrier frequency
    var barrierCount = {};
    BARRIERS.concat([OTHER_LABEL]).forEach(function(b){ barrierCount[b]=0; });
    rows.forEach(function(r){ (r.barriers||[]).forEach(function(b){ barrierCount[b] = (barrierCount[b]||0)+1; }); });
    var barrierSorted = Object.keys(barrierCount).map(function(b){ return {label:b, count:barrierCount[b]}; })
      .filter(function(x){return x.count>0;})
      .sort(function(a,b){ return b.count-a.count; });
    var topBarrier = barrierSorted[0] ? barrierSorted[0].label : "—";
    var otherTexts = rows.map(function(r){ return r.otherBarrierText; }).filter(function(t){ return t && t.trim(); });

    var html = head;
    html += '<div class="results-head" style="margin-top:-10px">' +
      '<div style="display:flex;gap:10px"><button class="btn btn-ghost" id="btn-lock" style="padding:8px 14px;font-size:12.5px">Lock dashboard</button>' +
      '<button class="btn btn-ghost" id="btn-refresh" style="padding:8px 14px;font-size:12.5px">↻ Refresh</button></div>' +
      '<div class="status-toggle" title="Change this in the Config tab of the Google Sheet"><span class="lbl">Survey '+(meta.open===false?'closed':'open')+'</span>' +
      '<div class="switch '+(meta.open!==false?'on':'')+'" style="cursor:default"><div class="knob"></div></div></div>' +
    '</div>';

    // filters
    var fnOpts = distinctValues("businessFunction");
    var gradeOpts = distinctValues("gradeLevel");
    html += '<div class="filters">' +
      '<select id="filter-fn"><option value="ALL">All Business/Function</option>' + fnOpts.map(function(v){ return '<option value="'+esc(v)+'" '+(filters.fn===v?'selected':'')+'>'+esc(v)+'</option>'; }).join('') + '</select>' +
      '<select id="filter-grade"><option value="ALL">All Grade/Level</option>' + gradeOpts.map(function(v){ return '<option value="'+esc(v)+'" '+(filters.grade===v?'selected':'')+'>'+esc(v)+'</option>'; }).join('') + '</select>' +
      '<button class="btn btn-ghost export-btn" id="btn-export" '+(total===0?'disabled':'')+'>Export CSV</button>' +
    '</div>';

    if (!responsesLoaded){
      html += '<div class="empty-note">Loading results…</div>';
      mount.innerHTML = html;
      bindResultsEvents(mount);
      return;
    }

    if (total === 0){
      html += '<div class="empty-note">No responses match the current filters yet.</div>';
      mount.innerHTML = html;
      bindResultsEvents(mount);
      return;
    }

    // stat tiles
    html += '<div class="stat-tiles">' +
      '<div class="tile"><div class="tlabel">Responses</div><div class="tvalue mono">'+total+'</div><div class="tnote">'+(filters.fn!=='ALL'||filters.grade!=='ALL'?'matching current filters':'all submissions')+'</div></div>' +
      '<div class="tile"><div class="tlabel">Overall culture score</div><div class="tvalue mono">'+overallAvg.toFixed(2)+'<span class="unit">/5</span></div><div class="tnote" style="color:'+scoreColor(overallAvg)+'">'+scoreBand(overallAvg)+'</div></div>' +
      '<div class="tile"><div class="tlabel">Weakest statement</div><div class="tvalue" style="font-size:14.5px;line-height:1.35">'+(sortedAsc[0]?esc(sortedAsc[0].text):'—')+'</div><div class="tnote mono">'+(sortedAsc[0]?sortedAsc[0].mean.toFixed(2)+' / 5':'')+'</div></div>' +
      '<div class="tile"><div class="tlabel">Top barrier</div><div class="tvalue" style="font-size:15px;line-height:1.35">'+esc(topBarrier)+'</div><div class="tnote">'+(barrierSorted[0]? Math.round(barrierSorted[0].count/total*100)+'% of respondents' : '')+'</div></div>' +
    '</div>';

    html += '<div class="panel-grid"><div>';

    // Section A chart
    html += '<div class="panel"><h3>Section A — statement averages</h3><div class="phint">Sorted lowest to highest. Lower scores flag where the culture baseline is weakest.</div>';
    sortedAsc.forEach(function(m){
      var pct = (m.mean/5*100).toFixed(1);
      html += '<div class="bar-row"><div><div class="blabel">'+m.n+'. '+esc(m.text)+'</div><div class="bar-track"><div class="bar-fill" style="width:'+pct+'%;background:'+scoreColor(m.mean)+'"></div></div></div><div class="bar-val mono">'+m.mean.toFixed(2)+'</div></div>';
    });
    html += '<div class="legend">' +
      '<span><span class="sw" style="background:var(--critical)"></span>&lt;3.0 critical</span>' +
      '<span><span class="sw" style="background:var(--serious)"></span>3.0–3.49 at risk</span>' +
      '<span><span class="sw" style="background:#c98f00"></span>3.5–3.99 fair</span>' +
      '<span><span class="sw" style="background:var(--good)"></span>≥4.0 strong</span>' +
    '</div></div>';

    // Qualitative
    html += '<div class="panel"><h3>Open-ended responses</h3><div class="phint">Verbatim answers for the current filter.</div>' +
      '<div class="qual-tabs">' + OPEN_QUESTIONS.map(function(oq,i){ return '<button class="qual-tab'+(activeQualTab===oq.key?' active':'')+'" data-qualtab="'+oq.key+'">Q'+(27+i)+'</button>'; }).join('') + '</div>' +
      '<div class="qual-list">';
    var activeOq = OPEN_QUESTIONS.filter(function(o){return o.key===activeQualTab;})[0];
    var texts = rows.map(function(r){ return { text: r[activeQualTab], tag: r.businessFunction || "Unspecified function" }; }).filter(function(t){ return t.text && t.text.trim(); });
    if (texts.length === 0){
      html += '<div class="empty-note" style="padding:8px 2px;">No responses yet for this question.</div>';
    } else {
      texts.forEach(function(t){
        html += '<div class="qual-item"><div class="qmeta">'+esc(t.tag)+'</div><p>'+esc(t.text)+'</p></div>';
      });
    }
    html += '</div></div>';

    html += '</div><div>'; // right column

    // Barriers chart
    html += '<div class="panel"><h3>Section B — top barriers</h3><div class="phint">Share of respondents who selected each factor (max 3 per person).</div>';
    if (barrierSorted.length === 0){
      html += '<div class="empty-note" style="padding:6px 2px;">No barriers selected yet.</div>';
    }
    barrierSorted.slice(0,12).forEach(function(b){
      var pct = Math.round(b.count/total*100);
      html += '<div class="barrier-row"><div><div class="blabel">'+esc(b.label)+'</div><div class="bar-track"><div class="bar-fill" style="width:'+pct+'%;background:var(--accent-2)"></div></div></div><div class="bar-val mono">'+pct+'%</div></div>';
    });
    html += '</div>';

    if (otherTexts.length){
      html += '<div class="panel"><h3>“Other” barriers, in respondents’ words</h3><div class="qual-list" style="max-height:220px">';
      otherTexts.forEach(function(t){ html += '<div class="qual-item"><p>'+esc(t)+'</p></div>'; });
      html += '</div></div>';
    }

    html += '</div></div>'; // end panel-grid

    // Business/Function-wise and Job Grade-wise breakdown
    var byFunction = groupStats(rows, "businessFunction");
    var byGrade = groupStats(rows, "gradeLevel");
    html += '<div class="panel-grid">' +
      '<div>' + renderGroupPanel("Business / Function — culture score comparison", "Average Section A score and response count by Business/Function.", byFunction) + '</div>' +
      '<div>' + renderGroupPanel("Job Grade — culture score comparison", "Average Section A score and response count by Job Grade.", byGrade) + '</div>' +
    '</div>';

    // Rating distribution + response trend over time
    var dist = ratingDistribution(rows);
    var byDate = responsesByDate(rows);
    html += '<div class="panel-grid">';

    html += '<div><div class="panel"><h3>Rating distribution</h3><div class="phint">Share of every individual answer across all 25 Section A statements.</div>';
    dist.forEach(function(d, i){
      var color = i<=1 ? 'var(--critical)' : i===2 ? '#c98f00' : 'var(--good)';
      html += '<div class="bar-row"><div><div class="blabel">'+(i+1)+' — '+esc(d.label)+'</div><div class="bar-track"><div class="bar-fill" style="width:'+d.pct.toFixed(1)+'%;background:'+color+'"></div></div></div><div class="bar-val mono">'+d.pct.toFixed(0)+'%</div></div>';
    });
    html += '</div></div>';

    html += '<div><div class="panel"><h3>Responses over time</h3><div class="phint">Submissions received per day.</div>';
    if (byDate.length === 0 || (byDate.length===1 && byDate[0].label==="Unknown")){
      html += '<div class="empty-note" style="padding:6px 2px;">No timestamped responses yet.</div>';
    } else {
      var maxCount = Math.max.apply(null, byDate.map(function(d){return d.count;}));
      byDate.forEach(function(d){
        var pct = Math.round(d.count/maxCount*100);
        html += '<div class="barrier-row"><div><div class="blabel">'+esc(d.label)+'</div><div class="bar-track"><div class="bar-fill" style="width:'+pct+'%;background:var(--accent)"></div></div></div><div class="bar-val mono">'+d.count+'</div></div>';
      });
    }
    html += '</div></div>';

    html += '</div>'; // end second panel-grid

    // Participation rate (needs a manually entered headcount, kept in this browser only)
    var hc = getHeadcount();
    html += '<div class="panel"><h3>Participation rate</h3><div class="phint">Enter total workforce headcount to calculate response rate. Saved in this browser only.</div>';
    if (hc){
      html += '<div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap">' +
        '<div class="tvalue mono" style="font-size:24px">'+Math.min(100, Math.round(total/hc*100))+'<span class="unit">%</span></div>' +
        '<div class="tnote">'+total+' of '+hc+' employees responded</div>' +
        '<button class="btn btn-ghost" id="btn-edit-headcount" style="padding:6px 12px;font-size:12px;margin-left:auto">Edit headcount</button>' +
      '</div>';
    } else {
      html += '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">' +
        '<input type="number" id="f-headcount" placeholder="Total employees" style="max-width:180px;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:9px 12px;font-size:13px;">' +
        '<button class="btn btn-primary" id="btn-save-headcount" style="padding:9px 16px;font-size:13px">Save</button>' +
      '</div>';
    }
    html += '</div>';

    // Top barrier breakdown by Business/Function and Job Grade
    var topBarrierFn = topBarrierByGroup(rows, "businessFunction");
    var topBarrierGrade = topBarrierByGroup(rows, "gradeLevel");
    html += '<div class="panel-grid">' +
      '<div>' + renderTopBarrierPanel("Top barrier by Business/Function", "Most frequently selected Section B barrier within each function.", topBarrierFn) + '</div>' +
      '<div>' + renderTopBarrierPanel("Top barrier by Job Grade", "Most frequently selected Section B barrier within each grade.", topBarrierGrade) + '</div>' +
    '</div>';

    // Weakest 3 statements per Business/Function (drill-down)
    var weakestFn = weakestByGroup(rows, "businessFunction", 3);
    html += renderWeakestPanel("Weakest 3 statements per Business/Function", "Lowest-scoring Section A statements within each function — where to focus improvement.", weakestFn);

    // Keyword/theme summary across open-ended answers
    var keywords = keywordSummary(rows);
    html += '<div class="panel"><h3>Common themes in open-ended answers</h3><div class="phint">Most frequent keywords across Q27–30 responses (simple word-frequency, English only).</div>';
    if (keywords.length === 0){
      html += '<div class="empty-note" style="padding:6px 2px;">No open-ended text yet.</div>';
    } else {
      var maxKw = keywords[0].count;
      keywords.forEach(function(k){
        var pct = Math.round(k.count/maxKw*100);
        html += '<div class="bar-row"><div><div class="blabel">'+esc(k.label)+'</div><div class="bar-track"><div class="bar-fill" style="width:'+pct+'%;background:var(--accent)"></div></div></div><div class="bar-val mono">'+k.count+'</div></div>';
      });
    }
    html += '</div>';

    mount.innerHTML = html;
    bindResultsEvents(mount);
  }

  function bindResultsEvents(mount){
    var lockBtn = el("btn-lock");
    if (lockBtn) lockBtn.addEventListener("click", function(){
      resultsUnlocked = false;
      responsesLoaded = false;
      try{ localStorage.removeItem(HR_CODE_KEY); }catch(e){}
      renderResults();
    });
    var refreshBtn = el("btn-refresh");
    if (refreshBtn) refreshBtn.addEventListener("click", function(){
      if (storedHrCode) fetchResults(storedHrCode);
    });
    var ffn = el("filter-fn"); if (ffn) ffn.addEventListener("change", function(){ filters.fn = ffn.value; renderResults(); });
    var fgrade = el("filter-grade"); if (fgrade) fgrade.addEventListener("change", function(){ filters.grade = fgrade.value; renderResults(); });
    qa('[data-qualtab]', mount).forEach(function(btn){
      btn.addEventListener("click", function(){ activeQualTab = btn.getAttribute("data-qualtab"); renderResults(); });
    });
    var exportBtn = el("btn-export");
    if (exportBtn) exportBtn.addEventListener("click", exportCsv);
    var saveHc = el("btn-save-headcount");
    if (saveHc) saveHc.addEventListener("click", function(){
      var inp = el("f-headcount");
      var v = inp && parseInt(inp.value,10);
      if (v && v>0){ setHeadcount(v); renderResults(); }
    });
    var hcInput = el("f-headcount");
    if (hcInput) hcInput.addEventListener("keydown", function(e){
      if (e.key === "Enter"){ var v = parseInt(hcInput.value,10); if (v && v>0){ setHeadcount(v); renderResults(); } }
    });
    var editHc = el("btn-edit-headcount");
    if (editHc) editHc.addEventListener("click", function(){ setHeadcount(null); renderResults(); });
  }

  // Maps one row object as returned by the Apps Script /exec endpoint
  // (flat sheet columns) into the internal shape the dashboard renders.
  function normalizeRow(raw){
    var ratings = {};
    for (var i=1;i<=STATEMENTS.length;i++){
      var v = raw["Q"+i];
      if (v !== "" && v != null) ratings[i] = Number(v);
    }
    var barriers = String(raw.Barriers||"").split(" | ").map(function(s){return s.trim();}).filter(Boolean);
    return {
      businessFunction: raw.BusinessFunction || "",
      gradeLevel: raw.GradeLevel || "",
      ratings: ratings,
      barriers: barriers,
      otherBarrierText: raw.OtherBarrierText || "",
      biggestObstacle: raw.BiggestObstacle || "",
      managerAction: raw.ManagerAction || "",
      processToSimplify: raw.ProcessToSimplify || "",
      toolsNeeded: raw.ToolsNeeded || "",
      submittedAt: raw.Timestamp || ""
    };
  }

  function fetchResults(code){
    resultsLoading = true;
    passcodeError = false;
    renderResults();
    fetch(API_URL + "?action=results&code=" + encodeURIComponent(code))
      .then(function(res){ return res.json(); })
      .then(function(json){
        resultsLoading = false;
        if (!json || json.error){
          passcodeError = true;
          resultsUnlocked = false;
          try{ localStorage.removeItem(HR_CODE_KEY); }catch(e){}
          renderResults();
          return;
        }
        responses = (json.rows||[]).map(normalizeRow);
        meta.open = json.open !== false;
        meta.loaded = true;
        responsesLoaded = true;
        resultsUnlocked = true;
        storedHrCode = code;
        try{ localStorage.setItem(HR_CODE_KEY, code); }catch(e){}
        renderResults();
      })
      .catch(function(){
        resultsLoading = false;
        passcodeError = true;
        renderResults();
      });
  }

  function attemptUnlock(){
    if (!API_URL || API_URL.indexOf("PASTE_YOUR") === 0){
      alert("This page isn't connected to its Google Sheet yet — the site owner needs to finish setup.");
      return;
    }
    if (!passcodeDraft){ return; }
    fetchResults(passcodeDraft);
    passcodeDraft = "";
  }

  function csvEscape(v){
    var s = String(v == null ? "" : v);
    if (/[",\n]/.test(s)) s = '"' + s.replace(/"/g,'""') + '"';
    return s;
  }
  function exportCsv(){
    var rows = filteredResponses();
    var header = ["submittedAt","businessFunction","gradeLevel"]
      .concat(STATEMENTS.map(function(_,i){ return "Q"+(i+1); }))
      .concat(["barriers","otherBarrierText","biggestObstacle","managerAction","processToSimplify","toolsNeeded"]);
    var lines = [header.join(",")];
    rows.forEach(function(r){
      var line = [r.submittedAt||"", r.businessFunction||"", r.gradeLevel||""];
      for (var i=1;i<=STATEMENTS.length;i++) line.push(r.ratings && r.ratings[i] || "");
      line.push((r.barriers||[]).join(" | "));
      line.push(r.otherBarrierText||"");
      line.push(r.biggestObstacle||"");
      line.push(r.managerAction||"");
      line.push(r.processToSimplify||"");
      line.push(r.toolsNeeded||"");
      lines.push(line.map(csvEscape).join(","));
    });
    var csv = lines.join("\n");
    var blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "culture-pulse-responses.csv";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  }

  // ---------------------------------------------------------------
  // Tabs
  // ---------------------------------------------------------------
  function setTab(tab){
    activeTab = tab;
    el("tab-btn-survey").classList.toggle("active", tab==="survey");
    el("tab-btn-results").classList.toggle("active", tab==="results");
    el("view-survey").hidden = tab !== "survey";
    el("view-results").hidden = tab !== "results";
    if (tab === "results"){
      if (!resultsUnlocked && storedHrCode && !resultsLoading) fetchResults(storedHrCode);
      else renderResults();
    }
  }
  el("tab-btn-survey").addEventListener("click", function(){ setTab("survey"); });
  el("tab-btn-results").addEventListener("click", function(){ setTab("results"); });

  // ---------------------------------------------------------------
  // Init
  // ---------------------------------------------------------------
  try{
    if (localStorage.getItem(STORAGE_KEY)) submitted = true;
    storedHrCode = localStorage.getItem(HR_CODE_KEY);
  }catch(e){}

  renderSurvey();

  function fetchStatus(){
    if (!API_URL || API_URL.indexOf("PASTE_YOUR") === 0) return;
    fetch(API_URL + "?action=status")
      .then(function(res){ return res.json(); })
      .then(function(json){
        meta.open = !json || json.open !== false;
        meta.loaded = true;
        if (activeTab === "survey") renderSurvey();
      })
      .catch(function(){ meta.loaded = true; });
  }
  fetchStatus();

})();
</script>
